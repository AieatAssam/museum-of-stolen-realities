name: Publish

# Tag v* : build all platforms, attach them to a GitHub release, deploy the web build to Pages.
# Manual run: build all platforms as artifacts and deploy the web build to Pages (no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GAME: MuseumOfStolenRealities

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: Windows, dir: windows, file: MuseumOfStolenRealities.exe }
          - { preset: Linux, dir: linux, file: MuseumOfStolenRealities.x86_64 }
          - { preset: macOS, dir: macos, file: MuseumOfStolenRealities.zip }
          - { preset: Web, dir: web, file: index.html }
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import assets
        # The first import exits non-zero on some engine versions even when it succeeds; the export below is the real check.
        run: timeout 40m ~/godot/godot --headless --path . --import || true

      - name: Export
        run: |
          mkdir -p build/${{ matrix.dir }}
          ~/godot/godot --headless --path . --export-release "${{ matrix.preset }}" build/${{ matrix.dir }}/${{ matrix.file }}
          test -s build/${{ matrix.dir }}/${{ matrix.file }}

      - name: Zip desktop build
        if: matrix.preset == 'Windows' || matrix.preset == 'Linux'
        run: cd build/${{ matrix.dir }} && zip -q -r ../${GAME}-${{ matrix.dir }}.zip .

      - name: Name macOS build
        if: matrix.preset == 'macOS'
        run: mv build/macos/${{ matrix.file }} build/${GAME}-macos.zip

      - name: Upload desktop build
        if: matrix.preset != 'Web'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: build/${{ env.GAME }}-${{ matrix.dir }}.zip
          compression-level: 0

      - name: Upload web build for Pages
        if: matrix.preset == 'Web'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Deploy web build to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "{windows,linux,macos}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
